<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cita a ciegas con un disco</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');

/* =============================================
   VARIABLES GLOBALES
   ============================================= */
:root {
  --naranja: #D45E2A;
  --naranja-claro: #E8896A;
  --naranja-oscuro: #B84D1F;
  --beige: #F2EDE4;
  --beige-osc: #E8E0D4;
  --beige-borde: #DDD8CE;
  --negro: #1A1A1A;
  --texto-principal: #1A1A1A;
  --texto-secundario: #6A6460;
  --texto-terciario: #A09890;
  --texto-muted: #C4BDB5;
  --radio: 20px;
  --radio-lg: 28px;

  /* Escala tipográfica fluida: se adapta al ancho de la ventana */
  --fs-2xs: clamp(7.5px, 0.45vw + 6px, 9.5px);
  --fs-xs:  clamp(8.5px, 0.5vw + 6.8px, 11px);
  --fs-sm:  clamp(9.5px, 0.55vw + 7.6px, 12px);
  --fs-base:clamp(10.5px, 0.6vw + 8.4px, 13.5px);
  --fs-md:  clamp(11.5px, 0.7vw + 9px, 15px);
  --fs-lg:  clamp(13px, 0.9vw + 10px, 18px);
  --fs-xl:  clamp(16px, 1.2vw + 12px, 22px);
  --fs-2xl: clamp(19px, 1.6vw + 14px, 29px);
  --fs-3xl: clamp(24px, 2.4vw + 16px, 42px);

  /* Espaciados fluidos */
  --sp-2xs: clamp(3px, 0.3vw + 2px, 5px);
  --sp-xs:  clamp(5px, 0.45vw + 3.5px, 8px);
  --sp-sm:  clamp(7px, 0.6vw + 5px, 12px);
  --sp-md:  clamp(10px, 0.9vw + 6.5px, 18px);
  --sp-lg:  clamp(14px, 1.3vw + 9px, 26px);
  --sp-xl:  clamp(18px, 1.8vw + 11px, 36px);

  --page-max: 1560px;
}

/* =============================================
   RESET & BASE
   ============================================= */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: 'Inter', sans-serif;
  background: var(--naranja);
  color: var(--texto-principal);
  -webkit-font-smoothing: antialiased;
}

/* =============================================
   LAYOUT PRINCIPAL
   ============================================= */
.app-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--naranja);
  padding: var(--sp-md);
  gap: var(--sp-sm);
  max-width: var(--page-max);
  margin: 0 auto;
}

/* =============================================
   NAVEGACIÓN
   ============================================= */
.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--sp-xs);
  padding: var(--sp-sm) var(--sp-md);
  background: var(--negro);
  border-radius: var(--radio);
}

.nav-brand {
  font-family: 'Playfair Display', serif;
  font-size: var(--fs-md);
  font-weight: 700;
  color: var(--beige);
  letter-spacing: 0.5px;
  white-space: nowrap;
}

.nav-links {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}

.nav-link {
  font-size: var(--fs-xs);
  font-weight: 500;
  color: var(--texto-terciario);
  text-decoration: none;
  padding: var(--sp-2xs) var(--sp-sm);
  border-radius: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: all 0.2s;
  white-space: nowrap;
}

.nav-link:hover { color: var(--beige); background: rgba(255,255,255,0.06); }
.nav-link.active { background: var(--naranja); color: white; }

/* =============================================
   PANELS / CARDS
   ============================================= */
.panel {
  background: var(--beige);
  border-radius: var(--radio);
  padding: var(--sp-md);
}

.panel-dark {
  background: var(--beige);
  border: 2.5px solid var(--negro);
  border-radius: var(--radio);
  padding: var(--sp-md);
}

.panel-warm {
  background: var(--beige);
  border: 2.5px solid var(--naranja);
  border-radius: var(--radio);
  padding: var(--sp-md);
}

.panel-label {
  font-size: var(--fs-2xs);
  font-weight: 600;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--negro);
  margin-bottom: var(--sp-xs);
}

/* =============================================
   STATS ROW
   ============================================= */
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--sp-xs);
}

.stat {
  background: var(--beige);
  border-radius: 14px;
  padding: var(--sp-sm) var(--sp-md);
  min-width: 0;
}

.stat-label {
  font-size: var(--fs-2xs);
  font-weight: 500;
  color: var(--texto-terciario);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 2px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.stat-val {
  font-family: 'Playfair Display', serif;
  font-size: var(--fs-2xl);
  font-weight: 700;
  color: var(--naranja-oscuro);
  line-height: 1;
}

@media (max-width: 640px) {
  .stats-row { grid-template-columns: repeat(2, 1fr); gap: var(--sp-xs); }
}

/* =============================================
   BÚSQUEDA
   ============================================= */
.search-wrap {
  position: relative;
}

.search-wrap i {
  position: absolute;
  left: var(--sp-sm);
  top: 50%;
  transform: translateY(-50%);
  font-size: var(--fs-md);
  color: var(--texto-terciario);
  pointer-events: none;
}

.search-wrap input {
  width: 100%;
  font-size: var(--fs-base);
  padding: var(--sp-sm) var(--sp-md) var(--sp-sm) calc(var(--sp-xl) + 6px);
  border-radius: 12px;
  border: none;
  background: var(--beige);
  color: var(--texto-principal);
  outline: none;
  font-family: 'Inter', sans-serif;
}

.search-wrap input::placeholder { color: var(--texto-muted); }
.search-wrap input:focus { box-shadow: 0 0 0 2px var(--naranja-claro); }

/* =============================================
   TABLA
   ============================================= */
.table-panel {
  background: var(--beige);
  border: 2.5px solid var(--negro);
  border-radius: var(--radio);
  overflow: hidden;
  position: relative;
}

.table-scroll {
  overflow-x: auto;
  overflow-y: auto;
  max-height: min(60vh, 640px);
}

.table-scroll::-webkit-scrollbar { width: 3px; height: 3px; }
.table-scroll::-webkit-scrollbar-track { background: var(--beige-borde); }
.table-scroll::-webkit-scrollbar-thumb { background: var(--naranja); border-radius: 2px; }

table { border-collapse: collapse; width: 100%; }
thead { position: sticky; top: 0; z-index: 10; }

thead th {
  background: var(--negro);
  color: var(--beige);
  font-size: var(--fs-2xs);
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: var(--sp-sm) var(--sp-xs);
  text-align: left;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  position: relative;
}

thead th:hover { background: #2a2a2a; }
thead th.active-filter { color: var(--naranja-claro); }

tbody tr {
  border-bottom: 0.5px solid var(--beige-borde);
  cursor: pointer;
  transition: background 0.12s;
}

tbody tr:hover { background: var(--beige-osc); }

tbody tr.selected { background: var(--negro); }
tbody tr.selected td { color: var(--beige) !important; }
tbody tr.selected td.name { color: var(--naranja-claro) !important; }
tbody tr.selected td.final { color: var(--naranja-claro) !important; }

td {
  font-size: var(--fs-sm);
  color: var(--texto-secundario);
  padding: var(--sp-xs) var(--sp-xs);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

td.rank {
  color: var(--texto-muted);
  text-align: center;
  font-family: 'Playfair Display', serif;
  font-size: var(--fs-md);
}

td.name { color: var(--negro); font-weight: 500; max-width: clamp(90px, 16vw, 220px); }
td.num { text-align: center; }

td.final {
  font-weight: 700;
  color: var(--naranja-oscuro);
  text-align: center;
  font-family: 'Playfair Display', serif;
  font-size: var(--fs-md);
}

.mini-bar { height: 2px; background: var(--beige-borde); border-radius: 1px; margin-top: 3px; }
.mini-fill { height: 2px; background: var(--naranja); border-radius: 1px; opacity: 0.7; }
.no-results {
  padding: var(--sp-xl);
  text-align: center;
  font-size: var(--fs-sm);
  color: var(--texto-terciario);
  font-style: italic;
  font-family: 'Playfair Display', serif;
}

/* =============================================
   DROPDOWN FILTRO (tipo Excel)
   ============================================= */
.filter-dropdown {
  position: absolute;
  top: 100%;
  left: 0;
  min-width: clamp(160px, 22vw, 220px);
  background: var(--negro);
  border: 1px solid #333;
  border-radius: 10px;
  padding: var(--sp-xs);
  z-index: 200;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  display: none;
}

.filter-dropdown.open { display: block; }

.dd-search {
  width: 100%;
  font-size: var(--fs-xs);
  padding: var(--sp-2xs) var(--sp-xs);
  border-radius: 6px;
  border: 0.5px solid #333;
  background: #111;
  color: #ccc;
  outline: none;
  margin-bottom: var(--sp-2xs);
  font-family: 'Inter', sans-serif;
}

.dd-search::placeholder { color: #555; }
.dd-search:focus { border-color: var(--naranja); }

.dd-actions { display: flex; gap: var(--sp-xs); margin-bottom: var(--sp-2xs); }
.dd-action { font-size: var(--fs-2xs); color: #888; cursor: pointer; text-decoration: underline; }
.dd-action:hover { color: var(--naranja-claro); }

.dd-list { max-height: min(28vh, 170px); overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.dd-list::-webkit-scrollbar { width: 3px; }
.dd-list::-webkit-scrollbar-thumb { background: var(--naranja); border-radius: 2px; }

.dd-item { display: flex; align-items: center; gap: 6px; padding: 4px 5px; border-radius: 5px; cursor: pointer; }
.dd-item:hover { background: #2a2a2a; }
.dd-item input[type=checkbox] { accent-color: var(--naranja); cursor: pointer; width: 12px; height: 12px; flex-shrink: 0; }
.dd-item label { font-size: var(--fs-xs); color: #ccc; cursor: pointer; white-space: nowrap; }

.dd-apply {
  width: 100%;
  margin-top: var(--sp-xs);
  background: var(--naranja);
  color: white;
  border: none;
  padding: var(--sp-2xs);
  border-radius: 6px;
  font-size: var(--fs-xs);
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  letter-spacing: 0.5px;
  font-weight: 500;
}

.dd-apply:hover { background: var(--naranja-oscuro); }

/* =============================================
   SCROLLBAR GLOBAL
   ============================================= */
.custom-scroll::-webkit-scrollbar { width: 3px; }
.custom-scroll::-webkit-scrollbar-track { background: var(--beige-borde); border-radius: 2px; }
.custom-scroll::-webkit-scrollbar-thumb { background: var(--naranja); border-radius: 2px; }

/* =============================================
   BOTONES
   ============================================= */
.btn-dark {
  background: var(--negro);
  color: var(--beige);
  border: none;
  padding: var(--sp-sm) var(--sp-lg);
  border-radius: 10px;
  font-size: var(--fs-xs);
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.2s;
  white-space: nowrap;
}
.btn-dark:hover { background: #2a2a2a; }
.btn-dark:disabled { opacity: 0.3; cursor: default; }

.btn-outline {
  background: transparent;
  color: var(--texto-terciario);
  border: 1.5px solid var(--beige-borde);
  padding: var(--sp-sm) var(--sp-md);
  border-radius: 10px;
  font-size: var(--fs-xs);
  font-family: 'Inter', sans-serif;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.btn-outline:hover { border-color: var(--texto-terciario); color: var(--texto-secundario); }

/* =============================================
   LAYOUT DE PÁGINA (grilla lateral + panel derecho)
   Se usa en index.html; en las demás páginas estas
   reglas no aplican porque esas clases no existen ahí.
   ============================================= */
.page-grid {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: clamp(180px, 20vw, 250px) 1fr;
  gap: var(--sp-md);
}
.left-card { min-height: 0; align-self: start; }
.card-info { flex: none; min-height: 0; overflow-y: auto; }
.right-col { min-height: 0; display: flex; flex-direction: column; gap: var(--sp-sm); }
.panel-dark { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.panel-warm { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.top-list { flex: 1; overflow-y: auto; min-height: 0; }
.top-list::-webkit-scrollbar { width: 3px; }
.top-list::-webkit-scrollbar-thumb { background: var(--naranja); border-radius: 2px; }
.analysis-wrap { flex: 1; min-height: 0; overflow: hidden; }
.tracks-col { max-height: 100%; overflow-y: auto; }

.loading-screen { position: fixed; inset: 0; background: var(--naranja); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-sm); z-index: 999; }
.loading-title { font-family: 'Playfair Display', serif; font-size: var(--fs-xl); color: #F2EDE4; }
.loading-sub { font-size: var(--fs-xs); color: rgba(242,237,228,0.6); letter-spacing: 2px; text-transform: uppercase; }
.spinner { width: 32px; height: 32px; border: 2px solid rgba(242,237,228,0.2); border-top-color: #F2EDE4; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

</style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>

    .main-panel { background: var(--beige); border: 2.5px solid var(--negro); border-radius: var(--radio); padding: var(--sp-xl); width: 100%; display: flex; flex-direction: column; align-items: center; gap: var(--sp-lg); }
    .vibes-row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: min(90%, 340px); min-height: 22px; }
    .vibe { font-size: var(--fs-sm); color: var(--texto-terciario); letter-spacing: 0.5px; }

    .album-cover-img.show { opacity: 1; transform: scale(1); }
    .album-meta { position: relative; z-index: 1; text-align: center; display: flex; flex-direction: column; gap: 6px; opacity: 0; transition: opacity 1s ease 0.2s; padding: var(--sp-md) var(--sp-lg); background: rgba(10,8,6,0.4); border-radius: 14px; backdrop-filter: blur(1.5px); }
    .album-meta.show { opacity: 1; }

    .album-artist { font-size: var(--fs-sm); color: #cabfb5; letter-spacing: 2px; text-transform: uppercase; }
    .album-year { font-size: var(--fs-xs); color: #b8ada2; letter-spacing: 3px; }

    .wrap-cover {
      position: absolute; inset: 0; z-index: 2;
      display: flex; align-items: center; justify-content: center;
      background: repeating-linear-gradient(135deg, var(--naranja) 0px, var(--naranja) 16px, var(--naranja-oscuro) 16px, var(--naranja-oscuro) 32px);
      transition: transform 0.7s cubic-bezier(0.6,-0.28,0.74,0.05), opacity 0.55s ease 0.05s;
    }
    .wrap-cover.opening { transform: scale(1.5) rotate(10deg); opacity: 0; pointer-events: none; }
    .wrap-cover.hidden { display: none; }
    .wrap-cover-inner { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--beige); }
    .wrap-cover-icon { width: clamp(34px, 9vw, 54px); height: clamp(34px, 9vw, 54px); }
    .wrap-cover-lbl { font-size: var(--fs-2xs); letter-spacing: 2px; text-transform: uppercase; font-weight: 600; }
    canvas { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
    .btn-row { display: flex; gap: var(--sp-sm); flex-wrap: wrap; justify-content: center; }
    .info-panel {
      background: var(--beige);
      border: 2.5px solid var(--naranja);
      border-radius: var(--radio);
      padding: var(--sp-md);
      width: 100%;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.8s ease 0.4s, transform 0.8s ease 0.4s;
      display: none;
    }
    .info-panel.show { opacity: 1; transform: translateY(0); display: block; }
    .info-album { font-family: 'Playfair Display', serif; font-size: var(--fs-xl); color: var(--negro); }
    .info-artist-lbl { font-size: var(--fs-xs); color: var(--texto-terciario); letter-spacing: 2.5px; text-transform: uppercase; margin-top: 2px; }
    .info-sep { height: 0.5px; background: var(--beige-borde); margin: var(--sp-sm) 0; }
    .info-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: var(--sp-xs); }
    .info-item { display: flex; flex-direction: column; gap: 1px; }
    .info-label { font-size: var(--fs-2xs); color: var(--texto-terciario); letter-spacing: 1.5px; text-transform: uppercase; }
    .info-val { font-size: var(--fs-sm); color: var(--texto-secundario); }
    .score-row { display: flex; align-items: baseline; gap: var(--sp-xs); margin-top: var(--sp-xs); }
    .score-big { font-family: 'Playfair Display', serif; font-size: var(--fs-3xl); color: var(--naranja-oscuro); line-height: 1; }
    .score-lbl { font-size: var(--fs-xs); color: var(--texto-terciario); letter-spacing: 2px; text-transform: uppercase; }

    @media (max-width: 420px) {
      .info-grid { grid-template-columns: repeat(2,1fr); }
    }
</style>

<body>

<div class="loading-screen" id="loading">
  <div class="spinner"></div>
  <div class="loading-title">One-Hit Wonder</div>
  <div class="loading-sub">Cargando discos...</div>
</div>

<div class="app-shell">
  <nav class="nav">
    <span class="nav-brand">One-Hit Wonder</span>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Reseña</a>

    </div>
  </nav>

  <div class="cita-wrap">
    <div class="main-panel">

      <div class="stage">

          <div class="album-cover-img" id="album-cover-img"></div>
          <div class="album-meta" id="meta">

            <div class="divider-line"></div>
            <div class="album-artist" id="m-artist"></div>
            <div class="album-year" id="m-year"></div>

        </div>
        <div class="wrap-cover" id="wrapCover">

              <circle cx="24" cy="24" r="16" fill="none" stroke="rgba(242,237,228,0.18)" stroke-width="1"/>
              <circle cx="24" cy="24" r="11" fill="none" stroke="rgba(242,237,228,0.18)" stroke-width="1"/>
              <circle cx="24" cy="24" r="6.5" fill="#D45E2A"/>

            </svg>

          </div>
        </div>
        <canvas id="cv" width="240" height="240"></canvas>
      </div>

      <div class="btn-row">
        <button class="btn-dark" id="mainBtn" onclick="handleMain()">Quiero un disco</button>
        <button class="btn-outline" id="rstBtn" onclick="resetAll()" style="display:none">↺ Otro disco</button>
      </div>
    </div>

    <div class="info-panel" id="infoPanel">
      <div class="info-album" id="i-album"></div>
      <div class="info-artist-lbl" id="i-artist"></div>

  { id:9, ep:9, name:"Exodus", artist:"Bob Marley", country:"Jamaica", year:1977, genre:"Roots Reggae", subgenre:"Roots Reggae", tracks:10, duration:37, c:8.0, k:8.5, v:8.0, a:7.5, citaCiegas:false, vibes:[], cover:"", songs:["Natural Mystic","So Much Things to Say","Guiltiness","The Heathen","Exodus","Jamming","Waiting in Vain","Turn Your Lights Down Low","Three Little Birds","One Love"], songScores:[8.5,8,8,8,9.5,9,9,8.5,8.5,9] },
  { id:10, ep:10, name:"Off the Wall", artist:"Michael Jackson", country:"Estados Unidos", year:1979, genre:"Disco Funk", subgenre:"Disco Funk", tracks:10, duration:41, c:8.0, k:7.5, v:7.5, a:7.0, citaCiegas:true, vibes:["bailable","festivo","elegante","groovy"], cover:"", songs:["Don't Stop 'Til You Get Enough","Rock With You","Workin' Day and Night","Get on the Floor","Off the Wall","Girlfriend","She's Out of My Life","I Can't Help It","It's the Falling in Love","Burn This Disco Out"], songScores:[9.5,9.5,8,8,8.5,7,8.5,7.5,7,7.5] }

FALLBACK_DISCOS.forEach(d => { d.score = parseFloat((d.c*0.4+d.k*0.25+d.v*0.25+d.a*0.1).toFixed(2)); });

const APP = {
  setSelected(disco) {
    try { localStorage.setItem('selectedDisco', disco ? String(disco.id) : null); } catch(e) {}
  },
  getSelected() {
    try {
      const id = localStorage.getItem('selectedDisco');
      return id ? (DISCOS.find(d => d.id === parseInt(id)) || DISCOS[0]) : DISCOS[0];
    } catch(e) { return DISCOS[0]; }
  }
};

function normalizeStr(s) {
  return (s == null ? '' : String(s)).normalize('NFD').replace(/\p{Mn}/gu,'').toLowerCase().trim();
}

function parseNum(s) {
  if (s == null) return 0;
  const n = parseFloat(String(s).trim().replace(',', '.'));
  return isNaN(n) ? 0 : n;
}

function parseCSV(text) {
  // Parser CSV completo: respeta comillas, comas y saltos de línea dentro de celdas
  // (Google Sheets exporta encabezados con salto de línea, ej. "Punt. Canciones\n (40%)")
  const rows = [];
  let row = [], cur = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') {
        if (text[i+1] === '"') { cur += '"'; i++; }
        else inQ = false;
      } else cur += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ',') { row.push(cur); cur=''; }
      else if (ch === '\r') { /* ignorar */ }
      else if (ch === '\n') { row.push(cur); cur=''; rows.push(row); row=[]; }
      else cur += ch;
    }
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }

  const cleaned = rows.map(r => r.map(v => v.trim()));
  // Saltea filas "título" (como "DISCOS,,,,,") que traen una sola celda con contenido
  let headerIdx = cleaned.findIndex(r => r.filter(v => v).length > 1);
  if (headerIdx === -1) headerIdx = 0;
  const headers = cleaned[headerIdx];
  return cleaned.slice(headerIdx + 1).map(vals => {
    const obj = {};
    headers.forEach((h,i) => obj[h] = vals[i] || '');
    return obj;
  }).filter(r => Object.values(r).some(v => v && v.trim()));
}

function getKey(row, part) {
  const np = normalizeStr(part);
  const key = Object.keys(row).find(k => normalizeStr(k).includes(np));
  return key ? row[key] : '';
}

function mapDisco(row) {
  const c = parseNum(getKey(row,'Canciones'));
  const k = parseNum(getKey(row,'Concepto'));
  const v = parseNum(getKey(row,'Visual'));
  const a = parseNum(getKey(row,'Adicionales'));
  const ciegas = normalizeStr(getKey(row,'Cita'));
  return {
    id: parseInt(getKey(row,'ID')||0),
    ep: parseInt(getKey(row,'Episodio')||0),
    name: getKey(row,'Album')||'',
    artist: getKey(row,'Artista')||'',
    country: getKey(row,'Pais')||'',
    year: parseInt(getKey(row,'Ano')||0),
    genre: getKey(row,'Genero')||'',
    subgenre: getKey(row,'Subgenero')||'',
    tracks: parseInt(getKey(row,'Tracks')||0),
    duration: parseInt(getKey(row,'Duracion')||0),
    c, k, v, a,
    score: parseFloat((c*0.4+k*0.25+v*0.25+a*0.1).toFixed(2)),
    citaCiegas: ciegas.includes('si'),
    vibes: (getKey(row,'Vibes')||getKey(row,'Tags')||'').split(',').map(x=>x.trim()).filter(Boolean),
    cover: getKey(row,'Link')||'',
    songs: [], songScores: []
  };
}

function mapTrack(row) {
  return {
    discoId: parseInt(getKey(row,'ID')||0),
    num: parseInt(getKey(row,'Track')||0),
    name: getKey(row,'Nombre')||'',
    score: parseNum(getKey(row,'Puntaje'))
  };
}

async function loadData() {
  // Arranca con los datos de respaldo — nunca se queda trabado
  DISCOS = JSON.parse(JSON.stringify(FALLBACK_DISCOS));

  // Intenta traer la planilla real vía nuestra propia función serverless
  // (/api/sheet), sin depender de proxies de terceros. Si tarda más de
  // 5s o falla, se sigue mostrando con los datos de respaldo.
  try {
    const [dr, tr] = await Promise.all([
      fetch('/api/sheet?which=disco', {signal: AbortSignal.timeout(5000)}),
      fetch('/api/sheet?which=track', {signal: AbortSignal.timeout(5000)})
    ]);
    if (dr.ok && tr.ok) {
      const [dc, tc] = await Promise.all([dr.text(), tr.text()]);
      const newDiscos = parseCSV(dc).map(mapDisco).filter(d => d.id > 0 && d.name);
      if (newDiscos.length > 0) {
        const newTracks = parseCSV(tc).map(mapTrack).filter(t => t.discoId > 0);
        newDiscos.forEach(d => {
          const t = newTracks.filter(x=>x.discoId===d.id).sort((a,b)=>a.num-b.num);
          if (t.length) { d.songs=t.map(x=>x.name); d.songScores=t.map(x=>x.score); }
        });
        DISCOS = newDiscos;
        TRACKS = newTracks;
        console.log('Planilla actualizada OK');
      }
    }
  } catch(e) { /* se queda con los datos de respaldo */ }

  return true;
}

function burstConfetti() {
  const canvas = document.getElementById('cv');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const colors = ['#D45E2A', '#E8896A', '#F2EDE4', '#B84D1F'];
  const cx = W / 2, cy = H / 2;
  const particles = [];
  const n = 46;
  for (let i = 0; i < n; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 5.5;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1.5,
      size: 2 + Math.random() * 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.3
    });
  }
  const gravity = 0.12;
  const duration = 900;
  const start = performance.now();

  function frame(now) {
    const t = now - start;
    ctx.clearRect(0, 0, W, H);
    const life = Math.max(0, 1 - t / duration);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += gravity;
      p.rot += p.vr;
      ctx.save();
      ctx.globalAlpha = life;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      ctx.restore();
    });
    if (t < duration) requestAnimationFrame(frame);
    else ctx.clearRect(0, 0, W, H);
  }
  requestAnimationFrame(frame);
}

function reveal(d) {
  fillInfo(d);

  const wrap = document.getElementById('wrapCover');
  wrap.classList.add('opening');
  burstConfetti();

  document.getElementById('album-cover-img').classList.add('show');
  document.getElementById('meta').classList.add('show');
  document.getElementById('infoPanel').classList.add('show');

  document.getElementById('mainBtn').style.display = 'none';
  const rst = document.getElementById('rstBtn');
  rst.style.display = '';
  rst.disabled = false;

  setTimeout(() => {
    wrap.classList.add('hidden');
    busy = false;
  }, 760);
}

function pickAndReveal() {
  if (!DISCOS.length) return;
  const pool = DISCOS.filter(d => d.citaCiegas);
  const list = pool.length ? pool : DISCOS;
  const d = list[Math.floor(Math.random() * list.length)];
  reveal(d);
}

function handleMain() {
  if (busy) return;
  busy = true;
  pickAndReveal();
}

function resetAll() {
  if (busy) return;
  busy = true;

  document.getElementById('meta').classList.remove('show');
  document.getElementById('album-cover-img').classList.remove('show');
  document.getElementById('infoPanel').classList.remove('show');

  const wrap = document.getElementById('wrapCover');
  wrap.classList.remove('hidden');
  wrap.style.transition = 'none';
  wrap.classList.remove('opening');
  void wrap.offsetWidth; // fuerza reflow para poder re-animar
  wrap.style.transition = '';

  setTimeout(pickAndReveal, 260);
}

loadData().then(() => {
  document.getElementById('loading').style.display = 'none';
});
